#   export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
#   USER=$(kubectl get secret sequoia-pg-app -n sequoia-x -o jsonpath='{.data.user}' | base64 -d)
#   PASS=$(kubectl get secret sequoia-pg-app -n sequoia-x -o jsonpath='{.data.password}' | base64 -d)
#   DB=$(kubectl get secret sequoia-pg-app -n sequoia-x -o jsonpath='{.data.dbname}' | base64 -d)
#   kubectl -n sequoia-x create secret generic sequoia-x-db \
#     --from-literal=DATABASE_URL="postgresql://${USER}:${PASS}@sequoia-pg-rw.sequoia-x.svc.cluster.local:5432/${DB}?sslmode=require" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: sequoia-x-db
  namespace: sequoia-x
type: Opaque
stringData:
  # PLACEHOLDER — replace via make-db-secret.sh; do not commit real passwords.
  DATABASE_URL: "postgresql://sequoia:REPLACE_PASSWORD@sequoia-pg-rw.sequoia-x.svc.cluster.local:5432/sequoia?sslmode=require"
