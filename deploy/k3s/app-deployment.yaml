apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequoia-x
  namespace: sequoia-x
  labels:
    app: sequoia-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sequoia-x
  template:
    metadata:
      labels:
        app: sequoia-x
    spec:
      containers:
        - name: sequoia-x
          image: docker.io/library/sequoia-x:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            # CNPG app secret `uri` is postgresql://user:pass@host:port/dbname
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sequoia-x-db
                  key: DATABASE_URL
            # Optional: keep DB_PATH unset so get_db_path() uses DATABASE_URL
            - name: FEISHU_WEBHOOK_URL
              value: "https://placeholder.invalid/webhook"
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sequoia-x
  namespace: sequoia-x
  labels:
    app: sequoia-x
spec:
  type: NodePort
  selector:
    app: sequoia-x
  ports:
    - name: http
      port: 8002
      targetPort: http
      # Prefer host-facing 8002 when free; k3s NodePort range is usually 30000-32767.
      # If 8002 is outside NodePort range, use nodePort: 30002 and Tailscale to that,
      # or ClusterIP + host socat/port-forward (see RUNBOOK).
      nodePort: 30002
