apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sequoia-pg
  namespace: sequoia-x
spec:
  instances: 1

  # Small footprint for ~3–4Gi available RAM
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

  storage:
    size: 5Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: sequoia
      owner: sequoia

  # Backups disabled for now. Plug CN2 S3 later via barmanObjectStore, e.g.:
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://YOUR_CN2_BUCKET/sequoia-pg
  #     endpointURL: https://YOUR_CN2_S3_ENDPOINT
  #     s3Credentials:
  #       accessKeyId:
  #         name: sequoia-pg-backup-creds
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: sequoia-pg-backup-creds
  #         key: ACCESS_SECRET_KEY
  #     wal:
  #       compression: gzip
  #     data:
  #       compression: gzip
  #   retentionPolicy: "7d"
  # enableBackup is effectively off by omitting backup.barmanObjectStore

  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "50"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
